<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawler Page</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .crawler-box { background: #fff; padding: 25px; border-radius: 6px; margin: 30px 0; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { background: #008837; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    textarea { width: 100%; height: 250px; padding: 10px; font-family: monospace; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <div class="container nav-bar">
      <a href="index.html" class="logo">DÂN TRÍ</a>
      <ul class="nav-menu" id="nav-menu"></ul>
    </div>
  </header>

  <main class="container">
    <div class="crawler-box">
      <h2>Chức năng Crawler tin tức</h2>
      <p style="margin-bottom: 15px;">Nhập URL bài viết từ trang dantri.com.vn:</p>
      <div class="form-group">
        <label for="crawlUrl">URL bài viết:</label>
        <input type="text" id="crawlUrl" placeholder="https://dantri.com.vn/bat-dong-san/ha-noi-tinh-co-che-boi-thuong-dat-dac-biet-cho-7-du-an-duong-sat-20260928122246655.htm">
      </div>
      <button class="btn" onclick="executeCrawl()">Bắt đầu Crawl</button>

      <div class="form-group" style="margin-top: 20px;">
        <label>Kết quả Dữ liệu JSON (Đã tự động lưu vào LocalStorage):</label>
        <textarea id="jsonResult" readonly></textarea>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/crawler.js"></script>
</body>
</html>
