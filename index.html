    // Cập nhật LocalStorage
    localStorage.setItem('categories', JSON.stringify(categoriesObj));
    localStorage.setItem('posts', JSON.stringify(defaultPosts));

    function getAuthorName(author) {
      if (!author) return "Ban Biên Tập";
      if (typeof author === 'object') return author.name || "Ban Biên Tập";
      return author;
    }

    window.onload = function() {
      // 1. Render Navigation Menu
      const menuList = categoriesObj.menu;
      const navMenu = document.getElementById('nav-menu');

      navMenu.innerHTML = menuList.map(cat => `
        <li>
          <a href="index.html?cat=${cat.id}">${cat.title}</a>
          ${cat.children ? `
            <ul class="dropdown">
              ${cat.children.map(child => `<li><a href="index.html?cat=${child.id}">${child.title}</a></li>`).join('')}
            </ul>
          ` : ''}
        </li>
      `).join('') + '<li><a href="crawler.html" style="color:red; font-weight:bold;">Crawler Page</a></li>';

      // 2. Logic Lọc bài viết
      const urlParams = new URLSearchParams(window.location.search);
      const selectedCat = urlParams.get('cat') || 'home';

      let filteredPosts = defaultPosts;

      if (selectedCat !== 'home' && selectedCat !== 'latest' && selectedCat !== '') {
        filteredPosts = defaultPosts.filter(p => p.catIds && p.catIds.includes(selectedCat));
      } else if (selectedCat === 'latest') {
        filteredPosts = [...defaultPosts].sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
      }

      const topSection = document.getElementById('top-section');
      const postsList = document.getElementById('posts-list');

      if (filteredPosts.length === 0) {
        topSection.innerHTML = '<h3 style="padding: 20px 0;">Chưa có bài viết thuộc chuyên mục này.</h3>';
        postsList.innerHTML = '';
        return;
      }

      // 3. Render Top Section linh hoạt (Xử lý thông minh khi chuyên mục có 1, 2 hoặc từ 3 bài trở lên)
      if (filteredPosts.length >= 3) {
        const top3 = filteredPosts.slice(0, 3);
        topSection.innerHTML = `
          <div class="featured-post">
            <a href="article.html?id=${top3[0].id}">
              <img src="${top3[0].image}" alt="${top3[0].title}">
              <h2>${top3[0].title}</h2>
              <p>${top3[0].excerpt}</p>
            </a>
          </div>
          <div class="side-posts">
            ${top3.slice(1, 3).map(p => `
              <div class="side-item">
                <a href="article.html?id=${p.id}">
                  <img src="${p.image}" alt="${p.title}">
                  <h4>${p.title}</h4>
                </a>
              </div>
            `).join('')}
          </div>
        `;
        const rest = filteredPosts.slice(3);
        postsList.innerHTML = rest.map(p => `
          <div class="post-card">
            <img src="${p.image}" alt="${p.title}">
            <div class="post-card-content">
              <div>
                <h3><a href="article.html?id=${p.id}">${p.title}</a></h3>
                <p>${p.excerpt}</p>
              </div>
              <div class="post-meta">
                Tác giả: <strong>${getAuthorName(p.author)}</strong> | Ngày đăng: <span>${p.publishedAt}</span>
              </div>
            </div>
          </div>
        `).join('');
      } else {
        // Trường hợp chuyên mục có 1 hoặc 2 bài (ví dụ Kiều bào)
        topSection.innerHTML = `
          <div class="featured-post" style="grid-column: span 2;">
            <a href="article.html?id=${filteredPosts[0].id}">
              <img src="${filteredPosts[0].image}" alt="${filteredPosts[0].title}">
              <h2>${filteredPosts[0].title}</h2>
              <p>${filteredPosts[0].excerpt}</p>
            </a>
          </div>
        `;
        const rest = filteredPosts.slice(1);
        postsList.innerHTML = rest.map(p => `
          <div class="post-card">
            <img src="${p.image}" alt="${p.title}">
            <div class="post-card-content">
              <div>
                <h3><a href="article.html?id=${p.id}">${p.title}</a></h3>
                <p>${p.excerpt}</p>
              </div>
              <div class="post-meta">
                Tác giả: <strong>${getAuthorName(p.author)}</strong> | Ngày đăng: <span>${p.publishedAt}</span>
              </div>
            </div>
          </div>
        `).join('');
      }
    };
